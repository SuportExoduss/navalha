<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <!-- PWA: no iPhone o lembrete por push só chega com o Navalha adicionado à Tela de Início (iOS 16.4+). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Navalha" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Estilo recomendado pelo react-native-web: corpo em tela cheia, rolagem pelas ScrollViews. -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Fotos sem "Salvar imagem" no toque longo, no botão direito nem arrastando (o toque passa para o que está em volta). */
      img {
        pointer-events: none;
        -webkit-user-drag: none;
        -webkit-touch-callout: none;
        user-select: none;
      }
    </style>
  </head>

  <body>
    <noscript>Ative o JavaScript para usar o Navalha.</noscript>
    <div id="root"></div>
  </body>
</html>
