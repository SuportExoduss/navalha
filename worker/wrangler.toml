name = "navalha-worker"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
FIREBASE_PROJECT_ID = "navalha-1a8f5"
# Depois de liberar o acesso público do bucket (r2.dev ou domínio próprio), cole a URL aqui
# para as fotos não consumirem requisições do Worker:
FOTOS_URL_PUBLICA = ""
# Só a versão web do app (o app Android não manda Origin e não passa por CORS). SEC-016.
ORIGENS_PERMITIDAS = "https://navalha.web.app,http://localhost:8081"
# Página /metricas: bucket dos relatórios da Play (Play Console › Baixar relatórios › Estatísticas › copiar o URI
# do Cloud Storage; só o nome, ex.: pubsite_prod_rev_0123456789). A conta de serviço precisa de "Ver informações
# do app" com acesso GLOBAL em Usuários e permissões.
PLAY_BUCKET = ""

[[r2_buckets]]
binding = "FOTOS"
bucket_name = "navalha-fotos"

# Lembretes: minuto 5 de cada hora. Métricas: 9h e 21h UTC (6h e 18h em Brasília). Clube: minuto 35 de cada hora.
# 3 das 5 gratuitas; cada uma com a própria cota de chamadas.
[triggers]
crons = ["5 * * * *", "0 9,21 * * *", "35 * * * *"]

# Segredos (não versionar):
#   npx wrangler secret put GOOGLE_SA_EMAIL
#   npx wrangler secret put GOOGLE_SA_PRIVATE_KEY

# SEC-006: no máximo 20 fotos por minuto por conta (limitador nativo do Workers, gratuito).
[[ratelimits]]
name = "LIMITE_FOTOS"
namespace_id = "2001"

  [ratelimits.simple]
  limit = 20
  period = 60
